plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.bachphuc.trafficai'
    compileSdk 36

    defaultConfig {
        applicationId 'vn.bachphuc.trafficai'
        minSdk 26
        targetSdk 36
        versionCode 131
        versionName '1.3.1-s23-arm64'

        // Bản cài trực tiếp cho Samsung S23 Ultra và điện thoại Android 64-bit hiện đại.
        // Loại các thư viện native x86/32-bit không dùng tới để APK nhỏ và tải ổn định hơn.
        ndk {
            abiFilters 'arm64-v8a'
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    def media3Version = '1.11.0'
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-rtsp:${media3Version}"
    implementation "androidx.media3:media3-ui:${media3Version}"
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'

    testImplementation 'junit:junit:4.13.2'
}
