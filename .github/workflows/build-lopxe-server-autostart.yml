name: Build Lop Xe Server AutoStart Installer

on:
  push:
    branches: [lopxe-server-autostart]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        shell: pwsh
        run: |
          Expand-Archive -Path lopxe-server-autostart-source.zip -DestinationPath $env:RUNNER_TEMP\\lopxe -Force
          Move-Item $env:RUNNER_TEMP\\lopxe\\build-input\\lopxe2\\lopxe $env:GITHUB_WORKSPACE\\lopxe-local-server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: .\\lopxe-local-server\\build-windows.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LopXe_Server_Setup_AutoStart
          path: lopxe-local-server\\installer\\output\\LopXe_Server_Setup_1.1.0.exe
          if-no-files-found: error
          retention-days: 30
