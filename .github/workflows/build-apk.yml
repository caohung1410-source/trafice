name: Build installable APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TrafficAI_RTSP_Android_1.0_Source/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "TrafficAI_RTSP_Android_1.0_Source/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: TrafficAI_RTSP_Android_1.0_Source

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Bundle offline AI models
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o app/src/main/assets/models/yolo11n_coco.onnx \
            https://huggingface.co/webnn/yolo11n/resolve/main/onnx/yolo11n.onnx
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o app/src/main/assets/models/traffic_sign_vietnam_yolo11s.onnx \
            https://huggingface.co/star092304/traffic-sign-detection-vietnam-yolo/resolve/main/best.onnx
          test "$(stat -c%s app/src/main/assets/models/yolo11n_coco.onnx)" -ge 3000000
          test "$(stat -c%s app/src/main/assets/models/traffic_sign_vietnam_yolo11s.onnx)" -ge 30000000

      - name: Verify source
        run: bash tools/verify_project.sh

      - name: Build signed debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Give APK a stable name
        run: cp app/build/outputs/apk/debug/app-debug.apk TrafficAI_RTSP_Android_2.2.1_Overpass_Fix_ARM64_Debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: TrafficAI_RTSP_Android_2.2.1_Overpass_Fix_ARM64_Debug
          path: TrafficAI_RTSP_Android_1.0_Source/TrafficAI_RTSP_Android_2.2.1_Overpass_Fix_ARM64_Debug.apk
          if-no-files-found: error
          retention-days: 30
